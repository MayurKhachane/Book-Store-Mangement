name: Java CI with Maven

# 1. Trigger: Run this pipeline when code is pushed or a PR is opened on main
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# 2. Jobs: Define the build and test process
jobs:
  build:
    runs-on: ubuntu-latest # Runs on a clean virtual Linux machine

    steps:
    # Step 1: Download your repository code onto the runner
    - name: Checkout code
      uses: actions/checkout@v4

    # Step 2: Set up Java Development Kit (JDK) - Version 17 is standard
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin' # Eclipse Temurin is a reliable, open-source JDK distribution
        java-version: '17'
        cache: 'maven'      # Caches Maven dependencies to make future builds faster

    # Step 3: Build and test the project using Maven Wrapper (mvnw)
    # Note: Using ./mvnw is best practice because it uses the project's built-in Maven version
    - name: Build and Test with Maven
      run: ./mvnw clean verify
